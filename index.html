<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>EVA-01 VPN: Tactical Interface</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&family=Rajdhani:wght@600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #07070a;
            color: #f8fafc;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            padding: 25px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
            border: 2px solid #f97316;
            overflow: hidden;
        }

        /* Тактическая шапка */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed rgba(249, 115, 22, 0.3);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            letter-spacing: 2px;
            color: #f97316;
            text-shadow: 0 0 10px rgba(249, 115, 22, 0.5);
        }

        .system-status {
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            color: #a855f7;
            text-transform: uppercase;
        }

        /* Центральная панель управления */
        .control-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            gap: 20px;
        }

        .status-display {
            font-family: 'Share Tech Mono', monospace;
            font-size: 18px;
            color: #94a3b8;
            letter-spacing: 1px;
        }

        /* Кнопка запуска Евы */
        .sync-btn {
            background-color: transparent;
            border: 2px solid #f97316;
            color: #f97316;
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 900;
            padding: 20px 50px;
            border-radius: 4px;
            cursor: pointer;
            letter-spacing: 3px;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(249, 115, 22, 0.1);
        }

        .sync-btn:hover {
            background-color: rgba(249, 115, 22, 0.1);
            box-shadow: 0 0 25px rgba(249, 115, 22, 0.3);
        }

        .sync-btn.active {
            border-color: #a855f7;
            color: #a855f7;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.4);
        }

        .sync-btn.active:hover {
            background-color: rgba(168, 85, 247, 0.1);
        }

        /* Консоль терминала */
        .terminal {
            background-color: #020203;
            border: 1px solid rgba(249, 115, 22, 0.15);
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            color: #cbd5e1;
            padding: 12px;
            height: 120px;
            overflow-y: auto;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
        }

        .terminal-line {
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .terminal-line.info { color: #38bdf8; }
        .terminal-line.success { color: #4ade80; }
        .terminal-line.warn { color: #facc15; }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">EVA-01 VPN</div>
        <div class="system-status">SYS.STABLE // SYNC RATE: 100%</div>
    </div>

    <div class="control-panel">
        <div class="status-display" id="status-text">СТАТУС: ПОДКЛЮЧЕНИЕ ДОСТУПНО</div>
        <button class="sync-btn" id="action-btn">LAUNCH VPN</button>
    </div>

    <div class="terminal" id="terminal-console">
        <div class="terminal-line info">[SYS] Система инициализирована. Капсула пилота готова к синхронизации.</div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        const actionBtn = document.getElementById('action-btn');
        const statusText = document.getElementById('status-text');
        const consoleEl = document.getElementById('terminal-console');

        let isRunning = false;

        // Отправка команды на бэкенд при клике
        actionBtn.addEventListener('click', () => {
            isRunning = !isRunning;
            ipcRenderer.send('toggle-vpn', isRunning);

            if (isRunning) {
                actionBtn.innerText = 'DISCONNECT';
                actionBtn.classList.add('active');
                statusText.innerText = 'СТАТУС: ИДЕТ ПОДКЛЮЧЕНИЕ...';
                statusText.style.color = '#a855f7';
            } else {
                actionBtn.innerText = 'LAUNCH VPN';
                actionBtn.classList.remove('active');
                statusText.innerText = 'СТАТУС: ПОДКЛЮЧЕНИЕ ДОСТУПНО';
                statusText.style.color = '#94a3b8';
            }
        });

        // Логирование событий из Node.js прямо в наш тактический GUI
        ipcRenderer.on('vpn-log', (event, { type, text }) => {
            const line = document.createElement('div');
            line.className = `terminal-line ${type}`;
            line.innerText = `[${new Date().toLocaleTimeString()}] ${text}`;
            consoleEl.appendChild(line);
            consoleEl.scrollTop = consoleEl.scrollHeight;

            if (text.includes('Туннель удерживается')) {
                statusText.innerText = 'СТАТУС: СОЕДИНЕНИЕ ЗАЩИЩЕНО (10.0.0.2)';
                statusText.style.color = '#4ade80';
            }
            if (text.includes('Туннель закрыт')) {
                statusText.innerText = 'СТАТУС: ПОДКЛЮЧЕНИЕ ДОСТУПНО';
                statusText.style.color = '#94a3b8';
            }
        });
    </script>
</body>
</html>
